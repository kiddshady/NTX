appId: com.umbrovex.ntx
productName: NTX
# De acá salen los campos Copyright y Company de las propiedades del .exe, así
# que tiene que decir lo mismo que el `author` del package.json.
copyright: Copyright © 2026 Kidd Shady · Umbrovex Systems
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!node_modules/**/{CHANGELOG.md,README.md,readme.md,*.d.ts,*.map,*.ts}'
  - '!node_modules/**/{test,tests,__tests__,docs,doc,examples,example}/**'
extraResources:
  # El ícono del tray. Lo lee src/main/tray.ts desde process.resourcesPath, así
  # que tiene que salir del asar: adentro no hay ruta de archivo que Windows
  # pueda abrir. Son 2,6 KB — el icon.ico que antes vivía acá era copia exacta
  # del de build/ y no lo leía nadie, por eso ya no está.
  - from: resources/icons
    to: icons
  - from: src/main/shell-init
    to: shell-init
asarUnpack:
  - '**/node_modules/node-pty/**'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NTX
portable:
  artifactName: NTX-${version}-portable.exe
