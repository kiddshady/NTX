<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!--
  NTX · master vectorial del ícono.

  Reconstruido a partir de build/icon.png, que hasta ahora era el único master
  y estaba rasterizado a 1024. Toda la geometría de acá salió de MEDIR ese PNG,
  no de copiarlo a ojo:

    baldosa    x/y 31–992 (margen 3%), radio ~205 (21% del lado)
    chevron    M278,307 L498,483 L278,659   trazo 66
    guión      M566,665 L761,665            trazo 92
    degradé    #00e5ff → #ff2e88 en diagonal, compartido por las dos formas
    fondo      vertical #13131e → #08080e (uniforme en horizontal: no es radial)

  Desde la 1.8.1 (29 oct 2026, con la piel Opal) el `>_` es BLANCO con su glow
  sobre una baldosa negra sin tinte (#1a1a1a → #0a0a0a, la base de Opal abajo),
  como Prism y el resto de la familia Opal: una app acromática con un ícono de
  neón no tenía lógica. La geometría y las dos pasadas de glow no cambiaron.

  Hasta el 15 oct 2026 la baldosa llevaba scanlines (bandas de 9px cada 26 que
  restaban luz), haciendo juego con el vidrio CRT de la app. Fran lo quiso liso,
  como un ícono estándar: mismo glow, colores y baldosa, sin las bandas.

  Los tres bordes del bounding box del chevron dan el mismo grosor de trazo
  (66), así que la forma calca y no aproxima.
-->
<defs>
  <!-- El fondo de la baldosa. Medido a siete x distintas a la misma altura:
       da el mismo valor en todas, o sea que el degradé es vertical puro. -->
  <linearGradient id="ntx-tile" gradientUnits="userSpaceOnUse" x1="512" y1="31" x2="512" y2="992">
    <stop offset="0" stop-color="#1a1a1a"/>
    <stop offset="1" stop-color="#0a0a0a"/>
  </linearGradient>

  <!-- La tinta: blanca, con un aliento de gris hacia abajo a la derecha para
       que el trazo tenga volumen y no se lea como un recorte plano. -->
  <linearGradient id="ntx-ink" gradientUnits="userSpaceOnUse" x1="245" y1="274" x2="807" y2="711">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dcdce0"/>
  </linearGradient>

  <filter id="ntx-glow" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur stdDeviation="30"/>
  </filter>
  <filter id="ntx-glow-wide" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="58"/>
  </filter>

</defs>

<!--
  La baldosa va A SANGRE, y de ahí este transform.

  El diseño original dejaba 31px de margen transparente por lado, o sea que la
  baldosa ocupaba el 94% del lienzo. El resto de las apps (ntermx, por ejemplo)
  llenan el lienzo entero, así que en la barra de tareas y en el escritorio NTX
  se dibujaba ~6% más chico que sus hermanas sin que nada lo justificara.

  Se escala TODO en bloque desde el centro —factor 1024/962— en vez de reescribir
  cada coordenada: así las proporciones internas quedan intactas y los números de
  arriba se siguen leyendo contra el diseño original.
-->
<g transform="translate(512 512) scale(1.064449) translate(-511.5 -511.5)">

<rect x="31" y="31" width="962" height="962" rx="205" ry="205" fill="url(#ntx-tile)"/>

<g fill="none" stroke="url(#ntx-ink)" stroke-linecap="round" stroke-linejoin="round">
  <!-- El halo primero, y la forma nítida encima: así el glow no lava el trazo.
       Dos pasadas —una ancha y difusa, otra ceñida— porque con una sola el
       borde quedaba corto contra el original. -->
  <g filter="url(#ntx-glow-wide)" opacity=".42">
    <path d="M278 307 498 483 278 659" stroke-width="66"/>
    <path d="M566 665 761 665" stroke-width="92"/>
  </g>
  <g filter="url(#ntx-glow)" opacity=".72">
    <path d="M278 307 498 483 278 659" stroke-width="66"/>
    <path d="M566 665 761 665" stroke-width="92"/>
  </g>
  <path d="M278 307 498 483 278 659" stroke-width="66"/>
  <path d="M566 665 761 665" stroke-width="92"/>
</g>

</g>
</svg>
